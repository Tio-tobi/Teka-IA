[package]
name = "teka"
version = "0.1.0"
edition = "2021"
description = "Teka - agente cognitivo byte a byte, 100% local, CPU, Rust puro."

# Nucleo sem dependencias, de proposito: compila offline e nao baixa nada.
# Backends acelerados entram atras de feature flag, sempre validados contra a
# implementacao escalar de referencia (o oraculo).
[dependencies]

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
